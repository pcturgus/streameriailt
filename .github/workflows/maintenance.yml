name: Maintenance (clips, ranking, expire)

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
      KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Clips
        run: npm run sync:clips
      - name: Ranking
        if: ${{ !cancelled() }}
        run: npm run rank
      - name: Expire inactive channels
        if: ${{ !cancelled() }}
        run: npm run expire
      - name: Pranešti į Discord apie klaidą
        if: ${{ failure() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          PREV=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --limit 2 --json conclusion --jq '.[1].conclusion' 2>/dev/null || true)
          if [ "$PREV" = "failure" ]; then echo "Praeitas paleidimas irgi nepavyko, pranešimas nesiunčiamas"; exit 0; fi
          MSG=$(printf '⚠️ Workeris nepavyko: %s\n%s' "$WORKFLOW" "$RUN_URL")
          jq -n --arg c "$MSG" '{username:"Streameriai.Lt", content:$c, allowed_mentions:{parse:[]}}' | curl -sS -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
